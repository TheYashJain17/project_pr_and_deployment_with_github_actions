name: PR Validation 
on: 
  pull_request:
    # types: ["opened"]
    branches: 
      - dev
    paths-ignore: 
      # - ".github/workflows/*"
      - "README.md"

jobs:
    validate:

      timeout-minutes: 15

      permissions: 
        actions: read
        contents: read
        security-events: write

      runs-on: ubuntu-latest

      steps:
        - name: Setup Code
          uses: "actions/checkout@v4" 
          with:
            fetch-depth: 0
        - name: Setup Pnpm
          uses: pnpm/action-setup@v4
          with:
            version: 10
        
        - name: Setup Node
          uses: actions/setup-node@v4 
          with:
            node-version: 22
            cache: pnpm

        - name: Install Dependencies 
          run: "pnpm install --frozen-lockfile"
        - name: Build Application
          run: "pnpm run build"
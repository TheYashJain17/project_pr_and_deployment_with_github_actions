name: Code Deployment
on: 
  push: 
    branches: 
      - main
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout 
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      
      - name: Setup Pnpm 
        uses: "pnpm/action-setup@v4"
        with:
          version: 10
      
      - name: Setup Node 
        uses: "actions/setup-node@v4"
        with:
          node-version: 22
          cache: pnpm 
        
      - name: Install Dependencies
        run: "pnpm install --frozen-lockfile"

      - name: Building Application 
        run: "pnpm run build"

      - name: Installing Vercel CLI 
        run: "pnpm install -g vercel"

      - name: Deploy To Vercel 
        run: "vercel --prod --yes --token=${{secrets.NEW_DEPLOYMENT_TOKEN}}"